<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rotating Torus - Mathematical Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow: hidden;
        }

        .torus-container {
            position: relative;
            width: 600px;
            height: 600px;
            transform-style: preserve-3d;
            animation: rotateTorus 20s infinite linear;
        }

        @keyframes rotateTorus {
            0% {
                transform: rotateX(45deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(45deg) rotateY(360deg);
            }
        }

        .torus-point {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .info {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 10px;
            z-index: 1000;
            max-width: 700px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2em;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1em;
            line-height: 1.6;
            color: #e0e0e0;
        }

        .formula {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            margin: 15px 0;
            padding: 10px;
            background: rgba(78, 205, 196, 0.2);
            border-radius: 5px;
            color: #4ecdc4;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 1000;
        }

        .slider-container {
            margin: 10px 0;
        }

        label {
            display: inline-block;
            width: 150px;
            text-align: left;
        }

        input[type="range"] {
            width: 200px;
            vertical-align: middle;
        }

        .value-display {
            display: inline-block;
            width: 50px;
            text-align: right;
            color: #4ecdc4;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>3D Rotating Torus</h1>
        <p>Parametric equations for a torus (donut shape)</p>
        <div class="formula">
            x = (R + r·cos(v))·cos(u)<br>
            y = (R + r·cos(v))·sin(u)<br>
            z = r·sin(v)<br>
            u, v ∈ [0, 2π], R = major radius, r = minor radius
        </div>
    </div>

    <div class="torus-container" id="torusContainer"></div>

    <div class="controls">
        <div class="slider-container">
            <label>Major Radius (R):</label>
            <input type="range" id="majorRadius" min="100" max="200" value="150" step="10">
            <span class="value-display" id="majorValue">150</span>
        </div>
        <div class="slider-container">
            <label>Minor Radius (r):</label>
            <input type="range" id="minorRadius" min="20" max="80" value="50" step="5">
            <span class="value-display" id="minorValue">50</span>
        </div>
        <div class="slider-container">
            <label>Resolution:</label>
            <input type="range" id="resolution" min="20" max="60" value="40" step="5">
            <span class="value-display" id="resValue">40</span>
        </div>
    </div>

    <script>
        const container = document.getElementById('torusContainer');
        let majorRadius = 150;
        let minorRadius = 50;
        let resolution = 40;

        // Setup controls
        document.getElementById('majorRadius').addEventListener('input', (e) => {
            majorRadius = parseInt(e.target.value);
            document.getElementById('majorValue').textContent = majorRadius;
            generateTorus();
        });

        document.getElementById('minorRadius').addEventListener('input', (e) => {
            minorRadius = parseInt(e.target.value);
            document.getElementById('minorValue').textContent = minorRadius;
            generateTorus();
        });

        document.getElementById('resolution').addEventListener('input', (e) => {
            resolution = parseInt(e.target.value);
            document.getElementById('resValue').textContent = resolution;
            generateTorus();
        });

        // Generate torus using parametric equations
        function generateTorus() {
            container.innerHTML = '';
            
            const uSteps = resolution;
            const vSteps = Math.floor(resolution * 0.6);

            for (let i = 0; i < uSteps; i++) {
                for (let j = 0; j < vSteps; j++) {
                    // Parametric variables
                    const u = (i / uSteps) * 2 * Math.PI;
                    const v = (j / vSteps) * 2 * Math.PI;

                    // Torus parametric equations
                    const x = (majorRadius + minorRadius * Math.cos(v)) * Math.cos(u);
                    const y = (majorRadius + minorRadius * Math.cos(v)) * Math.sin(u);
                    const z = minorRadius * Math.sin(v);

                    // Create point
                    const point = document.createElement('div');
                    point.className = 'torus-point';
                    
                    // Color gradient based on position
                    const hue = (i / uSteps) * 360;
                    const brightness = 50 + (j / vSteps) * 50;
                    point.style.color = `hsl(${hue}, 100%, ${brightness}%)`;
                    point.style.background = `hsl(${hue}, 100%, ${brightness}%)`;
                    
                    // Position in 3D space
                    point.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
                    
                    container.appendChild(point);
                }
            }
        }

        // Initialize torus
        generateTorus();
    </script>
</body>
</html>
