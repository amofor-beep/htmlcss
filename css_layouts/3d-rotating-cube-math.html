<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rotating Cube - Mathematical Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow: hidden;
        }

        .scene {
            width: 300px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 10s infinite linear;
        }

        @keyframes rotate {
            0% {
                transform: rotateX(0deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }

        .cube-face {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-align: center;
            padding: 20px;
            opacity: 0.9;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
        }

        .front {
            transform: translateZ(150px);
            background: rgba(255, 99, 132, 0.3);
        }

        .back {
            transform: translateZ(-150px) rotateY(180deg);
            background: rgba(54, 162, 235, 0.3);
        }

        .right {
            transform: rotateY(90deg) translateZ(150px);
            background: rgba(255, 206, 86, 0.3);
        }

        .left {
            transform: rotateY(-90deg) translateZ(150px);
            background: rgba(75, 192, 192, 0.3);
        }

        .top {
            transform: rotateX(90deg) translateZ(150px);
            background: rgba(153, 102, 255, 0.3);
        }

        .bottom {
            transform: rotateX(-90deg) translateZ(150px);
            background: rgba(255, 159, 64, 0.3);
        }

        .info {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2em;
        }

        p {
            font-size: 1em;
            line-height: 1.5;
        }

        .formula {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>3D Rotating Cube</h1>
        <p>Mathematical 3D transformation using CSS</p>
        <div class="formula">
            rotateX(θ) + rotateY(φ)<br>
            θ, φ ∈ [0°, 360°]
        </div>
    </div>

    <div class="scene">
        <div class="cube">
            <div class="cube-face front">
                <div>
                    π ≈ 3.14159<br>
                    Front Face
                </div>
            </div>
            <div class="cube-face back">
                <div>
                    e ≈ 2.71828<br>
                    Back Face
                </div>
            </div>
            <div class="cube-face right">
                <div>
                    φ ≈ 1.61803<br>
                    Right Face
                </div>
            </div>
            <div class="cube-face left">
                <div>
                    √2 ≈ 1.41421<br>
                    Left Face
                </div>
            </div>
            <div class="cube-face top">
                <div>
                    i² = -1<br>
                    Top Face
                </div>
            </div>
            <div class="cube-face bottom">
                <div>
                    ∞ = Infinity<br>
                    Bottom Face
                </div>
            </div>
        </div>
    </div>
</body>
</html>
