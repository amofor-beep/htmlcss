<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spiral Helix - Mathematical Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 600px;
            height: 600px;
            transform-style: preserve-3d;
            animation: rotate 20s infinite linear;
        }

        @keyframes rotate {
            0% {
                transform: rotateY(0deg) rotateX(15deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(15deg);
            }
        }

        .sphere {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            box-shadow: 0 0 20px currentColor;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        .info {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 10px;
            z-index: 1000;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2em;
            color: #4fc3f7;
        }

        p {
            font-size: 1em;
            line-height: 1.6;
            color: #e0e0e0;
        }

        .formula {
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            margin: 15px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>3D Spiral Helix</h1>
        <p>Parametric equations in 3D space</p>
        <div class="formula">
            x = r·cos(t)<br>
            y = r·sin(t)<br>
            z = h·t<br>
            t ∈ [0, 4π]
        </div>
    </div>

    <div class="container" id="helix"></div>

    <script>
        const container = document.getElementById('helix');
        const numPoints = 100;
        const radius = 200;
        const height = 400;
        const turns = 2;

        // Generate helix points using parametric equations
        for (let i = 0; i < numPoints; i++) {
            const t = (i / numPoints) * (turns * 2 * Math.PI);
            
            // Parametric equations for helix
            const x = radius * Math.cos(t);
            const y = radius * Math.sin(t);
            const z = (height / 2) - (i / numPoints) * height;

            // Create sphere element
            const sphere = document.createElement('div');
            sphere.className = 'sphere';
            
            // Color based on position (rainbow gradient)
            const hue = (i / numPoints) * 360;
            sphere.style.color = `hsl(${hue}, 100%, 60%)`;
            sphere.style.background = `hsl(${hue}, 100%, 60%)`;
            
            // Position in 3D space
            sphere.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
            
            // Add animation delay for wave effect
            sphere.style.animationDelay = `${i * 0.02}s`;
            
            container.appendChild(sphere);
        }
    </script>
</body>
</html>
